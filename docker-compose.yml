name: civic-ai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic complaint.created --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic complaint.analyzed --partitions 3 --replication-factor 1
    restart: on-failure

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    entrypoint:
      - /bin/sh
      - -c
      - >-
        apk add git &&
        git clone --depth 1 https://gitlab.waffly.xyz/inner-voice/civic-ai/core-api.git /repo &&
        for f in $$(ls /repo/migrations/*.sql | sort); do
          echo "Applying $$f" &&
          psql -h postgres -U postgres -d postgres -f $$f || exit 1;
        done
    restart: on-failure

  core-api:
    image: registry.waffly.xyz/inner-voice/civic-ai/core-api:latest
    ports:
      - "8080:8080"
    environment:
      APP_SERVER__HOST: 0.0.0.0
      APP_SERVER__PORT: 8080
      APP_SERVER__JWT_SECRET: change_me_in_production
      APP_SERVER__JWT_COMPANY_NAME: CivicAI
      APP_SERVER__JWT_AUDIENCE: CivicAI
      APP_SERVER__JWT_EXPIRATION_SECONDS: 3600
      APP_SERVER__ENABLE_SWAGGER_UI: "true"
      APP_SERVER__ENABLE_OPEN_API: "true"
      APP_DATABASE__HOST: postgres
      APP_DATABASE__PORT: 5432
      APP_DATABASE__USER: postgres
      APP_DATABASE__PASSWORD: postgres
      APP_DATABASE__DATABASE: postgres
      APP_REDIS__HOST: redis
      APP_REDIS__PORT: 6379
      APP_REDIS__DATABASE: 0
      APP_KAFKA__BOOTSTRAP_SERVERS: kafka:9092
      APP_API__USERS__USER_NAME_REGEX: "^[a-zA-Z0-9_]{3,32}$"
      APP_API__USERS__PASSWORD_REGEX: "^.{8,128}$"
      APP_API__COMPLAINTS__TITLE_MIN_LENGTH: 1
      APP_API__COMPLAINTS__TITLE_MAX_LENGTH: 200
      APP_API__COMPLAINTS__CONTENT_MIN_LENGTH: 1
      APP_API__COMPLAINTS__CONTENT_MAX_LENGTH: 5000
      APP_API__COMPLAINTS__PRIORITY_MIN: 1
      APP_API__COMPLAINTS__PRIORITY_MAX: 5
      APP_API__CATEGORIES__NAME_MIN_LENGTH: 1
      APP_API__CATEGORIES__NAME_MAX_LENGTH: 100
      APP_API__TASKS__TITLE_MIN_LENGTH: 1
      APP_API__TASKS__TITLE_MAX_LENGTH: 200
      APP_API__TASKS__DESCRIPTION_MAX_LENGTH: 2000
      APP_API__ADMIN__USER_NAME: admin
      APP_API__ADMIN__EMAIL: admin@example.com
      APP_API__ADMIN__PASSWORD: Admin@123!
      RUST_LOG: info
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  complaint-analyzer:
    image: registry.waffly.xyz/inner-voice/civic-ai/complaint-analyzer:latest
    environment:
      APP_KAFKA__BOOTSTRAP_SERVERS: kafka:9092
      APP_KAFKA__TOPIC: complaint.created
      APP_KAFKA__OUTPUT_TOPIC: complaint.analyzed
      APP_KAFKA__GROUP_ID: complaint-analyzer
      APP_LLM__BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8000/v1}
      APP_LLM__API_KEY: ${LLM_API_KEY:-none}
      APP_LLM__MODEL: ${LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
    depends_on:
      kafka-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  kafka_data:
